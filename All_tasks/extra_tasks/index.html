<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>"Extras"</title>
        <style>
            .grid-container{
                display:grid;
                grid-template-columns: repeat(3, 100px);
                gap: 5px;
                width: 320px;
                margin: 50px auto;
            }

            .box{
                height: 100px;
                background-color: #ddd;
                border: 2px solid #333;
                font-size: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
            }

            .box:hover{
                background-color: #ccc;
            }
        </style>
    </head>
    <body style="font-family: sans-serif; padding: 20px;">
        <h2 style="text-align: center;">Tic-Tac-Toe (Delegation)</h2>
        <div id="mainBox" class="grid-container">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        
        <h3> The Delegator</h3>
        <p>Click any item to "delete" it. (turn it red)</p>
        <ul id="lst" style="cursor: pointer">
            <li>Task 1: Brushing your teeths.</li>
            <li>Task 2: Have Bath.</li>
            <li>Task 3: Wear perfume.</li>
        </ul>

        <button id="but" style="margin-top: 20px;">+ Add More</button>


        <a href="https://gemini.google.com/" id="dangerLink" style="font-size:16px; color: red;">Do not click this link!</a>
        <div id="newMsg" style="color: blue; margin-top: 20px;"></div>


        <div id="box" style="width:300px; height:300px; border:2px solid black;">I'm the box</div>
        <button id="my-btn">Submit</button>

        
        <script src="\All_tasks\extra_tasks\task4.js"></script>
    </body>
</html>
